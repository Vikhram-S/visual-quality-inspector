name: Continuous Integration & Quality Verification Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # Fast CI Test & Build Pipeline (Network-independent, < 2 minutes)
  fast-ci:
    name: Fast Verification & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install Backend & Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run Backend Pytest Suite (Fast In-Memory / SQLite)
        run: |
          python -m pytest backend/tests

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: |
          npm ci || npm install

      - name: Run Frontend Vitest Suite
        working-directory: ./frontend
        run: |
          npm test

      - name: Build Frontend Production Bundle
        working-directory: ./frontend
        run: |
          npm run build

  # Full ML Retraining & Evaluation Pipeline (Triggered manually or on ml/ changes)
  ml-evaluation:
    name: ML Model Retraining & Evaluation Pass
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[ml-train]') || contains(github.event.head_commit.message, '[full-ci]')))

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install ML Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Procedural & Holdout Datasets
        run: |
          python ml/generate_dataset.py

      - name: Train Ensemble Models
        run: |
          python ml/train.py

      - name: Evaluate Model Performance (Synthetic & Real Holdout)
        run: |
          python ml/evaluate.py
