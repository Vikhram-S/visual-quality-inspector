name: Continuous Integration & Verification Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install Backend & ML Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Generate Procedural & Holdout Datasets
        run: |
          python ml/generate_dataset.py

      - name: Train ML Defect Classifier Ensemble
        run: |
          python ml/train.py

      - name: Evaluate Model Generalization (Synthetic & Holdout)
        run: |
          python ml/evaluate.py

      - name: Run Backend Pytest Suite
        run: |
          python -m pytest backend/tests

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: |
          npm ci || npm install

      - name: Run Frontend Vitest Test Suite
        working-directory: ./frontend
        run: |
          npm test

      - name: Build Frontend Production Bundle
        working-directory: ./frontend
        run: |
          npm run build
